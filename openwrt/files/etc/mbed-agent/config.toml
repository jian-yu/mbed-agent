schema_version = 1
profile = "tiny"

[runtime]
max_active_tasks = 1
max_request_bytes = 65536
task_timeout_secs = 120
tool_timeout_secs = 3
max_tool_output_bytes = 65536

[server]
socket_path = "/tmp/mbed-agent/agent.sock"
socket_mode = 432

[storage]
path = "/tmp/mbed-agent/agent.db"
max_database_bytes = 8388608
max_artifacts_bytes = 8388608
max_rollback_bytes = 4194304
max_total_bytes = 25165824
runtime_headroom_bytes = 2097152
min_tmp_free_bytes = 8388608
min_tmp_free_percent = 10
cleanup_interval_secs = 60
max_diagnostic_records = 128
max_diagnostic_record_bytes = 32768

[logging]
level = "info"
directives = []
path = "/tmp/mbed-agent/log/agent.log"
format = "compact"
max_total_bytes = 2097152
max_file_bytes = 262144
max_files = 8
max_line_bytes = 4096
rate_limit_per_target_per_sec = 20

[llm]
enabled = false
provider = "open-ai-compatible"
base_url = "https://api.openai.com/v1"
api_key = ""
model = ""
system_prompt = "You are a professional Linux networking and OpenWrt engineer. Be precise, evidence-driven, and conservative about device changes."
connect_timeout_secs = 10
request_timeout_secs = 60
max_request_bytes = 32768
max_response_bytes = 131072
max_output_tokens = 1024
