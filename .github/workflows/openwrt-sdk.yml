name: OpenWrt SDK package

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  x86_64:
    name: OpenWrt ${{ matrix.release }} x86/64
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - release: 21.02.7
            firewall: fw3
          - release: 22.03.7
            firewall: fw4
          - release: 23.05.5
            firewall: fw4
          - release: 24.10.1
            firewall: fw4
          - release: 24.10.8
            firewall: fw4
    steps:
      - uses: actions/checkout@v4
      - name: Install musl linker and SDK decompressor
        run: sudo apt-get update && sudo apt-get install --yes musl-tools zstd
      - name: Install pinned Rust toolchain and musl target
        run: |
          rustup toolchain install 1.85.1 --profile minimal
          rustup target add x86_64-unknown-linux-musl --toolchain 1.85.1
      - name: Build x86_64 musl binary
        run: cargo +1.85.1 build --release --locked --target x86_64-unknown-linux-musl -p mbed-agent
      - name: Build and verify OpenWrt package
        run: |
          sh scripts/build-openwrt-sdk-package.sh \
            '${{ matrix.release }}' x86 64 \
            target/x86_64-unknown-linux-musl/release/mbed-agent
      - name: Upload package and metadata
        uses: actions/upload-artifact@v4
        with:
          name: mbed-agent-openwrt-${{ matrix.release }}-x86-64
          path: dist/openwrt/

  bcm2711:
    name: OpenWrt 24.10.8 bcm27xx/bcm2711
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SDK and Zig prerequisites
        run: sudo apt-get update && sudo apt-get install --yes python3-venv zstd
      - name: Install pinned Rust toolchain and target
        run: |
          rustup toolchain install 1.85.1 --profile minimal
          rustup target add aarch64-unknown-linux-musl --toolchain 1.85.1
      - name: Install pinned cross-build tools
        run: |
          python3 -m venv /tmp/mbed-agent-zig-venv
          /tmp/mbed-agent-zig-venv/bin/pip install ziglang==0.14.1
          cargo install cargo-zigbuild --version 0.20.1 --locked
          zig_path=$(/tmp/mbed-agent-zig-venv/bin/python -c \
            'import pathlib, ziglang; print(pathlib.Path(ziglang.__file__).parent / "zig")')
          echo "CARGO_ZIGBUILD_ZIG_PATH=$zig_path" >> "$GITHUB_ENV"
      - name: Build aarch64 musl binary
        run: cargo +1.85.1 zigbuild --release --locked --target aarch64-unknown-linux-musl -p mbed-agent
      - name: Validate binary and build package
        run: |
          file target/aarch64-unknown-linux-musl/release/mbed-agent | grep -F 'ARM aarch64'
          MBED_AGENT_SKIP_BINARY_EXEC=1 sh scripts/check-release-footprint.sh \
            target/aarch64-unknown-linux-musl/release/mbed-agent
          sh scripts/build-openwrt-sdk-package.sh \
            24.10.8 bcm27xx bcm2711 \
            target/aarch64-unknown-linux-musl/release/mbed-agent
      - name: Upload package and metadata
        uses: actions/upload-artifact@v4
        with:
          name: mbed-agent-openwrt-24.10.8-bcm27xx-bcm2711
          path: dist/openwrt/
