name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.85.1 --profile minimal --component rustfmt,clippy
      - name: Check formatting
        run: cargo +1.85.1 fmt --all -- --check
      - name: Run tests
        run: cargo +1.85.1 test --workspace --locked
      - name: Run Clippy
        run: cargo +1.85.1 clippy --workspace --all-targets --locked -- -D warnings
      - name: Build release binaries
        run: cargo +1.85.1 build --release --locked -p mbed-agent
      - name: Prepare release manifest smoke
        run: |
          MBED_AGENT_METADATA_PLATFORM=x86_64-unknown-linux-gnu \
            sh scripts/test-release-artifacts.sh
      - name: Validate OpenWrt service script
        run: sh -n openwrt/files/etc/init.d/mbed-agent
      - name: Validate OpenWrt package inputs
        run: |
          test -f openwrt/Makefile
          test -f .github/workflows/openwrt-sdk.yml
          test -f .github/workflows/release-candidate.yml
          sh scripts/validate-version.sh
          sh scripts/validate-openwrt-matrix.sh
          test -f openwrt/files/etc/config/mbed-agent
          test -f openwrt/files/etc/mbed-agent/config.toml
      - name: Validate generic Linux service scripts
        run: |
          sh -n packaging/linux/openrc/mbed-agent
          sh -n packaging/linux/busybox/mbed-agent.init
      - name: Validate integration and footprint helpers
        run: |
          sh -n scripts/run-linux-namespace-smoke.sh
          sh -n scripts/run-linux-firewall-namespace-smoke.sh
          sh -n scripts/run-linux-firewall-daemon-smoke.sh
          sh -n scripts/run-openwrt-qemu-smoke.sh
          sh -n scripts/run-openwrt-device-readonly-smoke.sh
          sh -n scripts/run-openwrt-device-firewall-rollback-smoke.sh
          sh -n scripts/run-openwrt-device-network-rollback-smoke.sh
          sh -n scripts/check-release-footprint.sh
          sh -n scripts/measure-daemon-rss.sh
          sh -n scripts/check-persistent-write-set.sh
          sh -n scripts/snapshot-persistent-tree.sh
          sh -n scripts/test-persistent-write-set.sh
          sh -n scripts/run-channel-protocol-soak.sh
          sh -n scripts/build-openwrt-sdk-package.sh
          sh -n scripts/prepare-release-artifacts.sh
          sh -n scripts/test-release-artifacts.sh
          sh -n scripts/validate-version.sh
          sh scripts/run-linux-namespace-smoke.sh
          sh scripts/check-release-footprint.sh target/release/mbed-agent
          sh scripts/measure-daemon-rss.sh target/release/mbed-agent config/mbed-agent.example.toml
          sh scripts/test-persistent-write-set.sh
          MBED_AGENT_CHANNEL_SOAK_ITERS=2000 sh scripts/run-channel-protocol-soak.sh
